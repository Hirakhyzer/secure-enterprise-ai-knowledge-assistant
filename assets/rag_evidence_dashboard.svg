<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-label="Secure enterprise RAG evidence dashboard">
  <rect width="1400" height="780" rx="30" fill="#07111f"/>
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#172554"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".25"/></filter></defs>
  <style>.title{font:800 32px Arial,Helvetica,sans-serif;fill:#f8fafc}.sub{font:500 14px Arial,Helvetica,sans-serif;fill:#94a3b8}.cardTitle{font:800 14px Arial,Helvetica,sans-serif;fill:#cbd5e1}.metric{font:900 38px Arial,Helvetica,sans-serif;fill:#fff}.small{font:500 12px Arial,Helvetica,sans-serif;fill:#94a3b8}.label{font:700 13px Arial,Helvetica,sans-serif;fill:#e2e8f0}</style>
  <rect x="30" y="30" width="1340" height="720" rx="28" fill="url(#g)" stroke="#334155"/>
  <text class="title" x="70" y="78">RAG Governance Evidence Dashboard</text><text class="sub" x="70" y="104">Academic-style summary of retrieval permissions, citation grounding, refusal behavior, and audit integrity from local synthetic runs.</text>
  <g filter="url(#s)">
    <rect x="70" y="140" width="250" height="116" rx="20" fill="#0f172a" stroke="#334155"/><text class="cardTitle" x="98" y="176">Synthetic documents</text><text class="metric" x="98" y="221">64</text><text class="small" x="166" y="214">fictional enterprise records</text>
    <rect x="350" y="140" width="250" height="116" rx="20" fill="#0f172a" stroke="#334155"/><text class="cardTitle" x="378" y="176">RBAC correctness</text><text class="metric" x="378" y="221" fill="#34d399">100%</text><text class="small" x="494" y="214">synthetic policy checks</text>
    <rect x="630" y="140" width="250" height="116" rx="20" fill="#0f172a" stroke="#334155"/><text class="cardTitle" x="658" y="176">Citation coverage</text><text class="metric" x="658" y="221" fill="#7dd3fc">0.94</text><text class="small" x="754" y="214">mean grounded evidence</text>
    <rect x="910" y="140" width="250" height="116" rx="20" fill="#0f172a" stroke="#334155"/><text class="cardTitle" x="938" y="176">Audit records</text><text class="metric" x="938" y="221" fill="#f59e0b">JSONL</text><text class="small" x="1054" y="214">hash-chained trace</text>
  </g>
  <g filter="url(#s)">
    <rect x="70" y="300" width="580" height="190" rx="22" fill="#0f172a" stroke="#334155"/><text class="label" x="104" y="336">Query status distribution</text><text class="small" x="104" y="360">Generated locally after running the synthetic RAG lab.</text>
    <text class="small" x="104" y="406">Answer with citations</text><rect x="258" y="390" width="320" height="20" rx="10" fill="#1e293b"/><rect x="258" y="390" width="250" height="20" rx="10" fill="#2563eb"/>
    <text class="small" x="104" y="444">Access-limited refusal</text><rect x="258" y="428" width="320" height="20" rx="10" fill="#1e293b"/><rect x="258" y="428" width="132" height="20" rx="10" fill="#d97706"/>
    <text class="small" x="104" y="482">Unsupported / unknown</text><rect x="258" y="466" width="320" height="20" rx="10" fill="#1e293b"/><rect x="258" y="466" width="96" height="20" rx="10" fill="#7c3aed"/>
    <rect x="720" y="300" width="600" height="190" rx="22" fill="#0f172a" stroke="#334155"/><text class="label" x="754" y="336">Role-document access matrix</text><text class="small" x="754" y="360">Illustrative matrix for synthetic HR, finance, legal, security, engineering, support, and executive documents.</text>
    <g transform="translate(754 388)"><rect width="480" height="78" rx="12" fill="#111827"/><g fill="#34d399"><rect x="20" y="18" width="28" height="28" rx="6"/><rect x="62" y="18" width="28" height="28" rx="6"/><rect x="146" y="18" width="28" height="28" rx="6"/><rect x="230" y="18" width="28" height="28" rx="6"/><rect x="314" y="18" width="28" height="28" rx="6"/></g><g fill="#475569"><rect x="104" y="18" width="28" height="28" rx="6"/><rect x="188" y="18" width="28" height="28" rx="6"/><rect x="272" y="18" width="28" height="28" rx="6"/><rect x="356" y="18" width="28" height="28" rx="6"/><rect x="398" y="18" width="28" height="28" rx="6"/></g><text class="small" x="20" y="66">green = authorized, gray = filtered before retrieval</text></g>
  </g>
  <g filter="url(#s)">
    <rect x="70" y="535" width="1250" height="150" rx="22" fill="#0f172a" stroke="#334155"/><text class="label" x="104" y="574">Audit and hallucination-control loop</text><text class="small" x="104" y="604">Every query can preserve: role, decision status, retrieved chunks, citation count, coverage, unsupported-claim score, previous hash, and record hash.</text>
    <circle cx="140" cy="648" r="22" fill="#2563eb"/><text x="140" y="655" text-anchor="middle" font-family="Arial" font-size="16" font-weight="900" fill="#fff">1</text><text class="small" x="178" y="653">Role policy</text><path d="M250 648 H342" stroke="#94a3b8" stroke-width="3"/>
    <circle cx="374" cy="648" r="22" fill="#0f766e"/><text x="374" y="655" text-anchor="middle" font-family="Arial" font-size="16" font-weight="900" fill="#fff">2</text><text class="small" x="412" y="653">Authorized retrieval</text><path d="M545 648 H637" stroke="#94a3b8" stroke-width="3"/>
    <circle cx="669" cy="648" r="22" fill="#7c3aed"/><text x="669" y="655" text-anchor="middle" font-family="Arial" font-size="16" font-weight="900" fill="#fff">3</text><text class="small" x="707" y="653">Citation answer</text><path d="M822 648 H914" stroke="#94a3b8" stroke-width="3"/>
    <circle cx="946" cy="648" r="22" fill="#d97706"/><text x="946" y="655" text-anchor="middle" font-family="Arial" font-size="16" font-weight="900" fill="#fff">4</text><text class="small" x="984" y="653">Hash-chained audit</text>
  </g>
</svg>