<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="790" viewBox="0 0 1440 790" role="img" aria-labelledby="title desc">
<title id="title">Secure Enterprise RAG Architecture</title><desc id="desc">Conceptual private RAG workflow with document ingestion, RBAC filtering, local retrieval, citation-grounded answer generation, hallucination checks, and audit logging.</desc>
<defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#071523"/><stop offset="1" stop-color="#173b55"/></linearGradient><linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#34d4ca"/><stop offset="1" stop-color="#6aa6ff"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".32"/></filter><marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L12 6 L0 12z" fill="#a8d0e5"/></marker><style>.h{font-family:Arial,Helvetica,sans-serif;font-size:34px;font-weight:700;fill:#f8fcff}.s{font-family:Arial,Helvetica,sans-serif;font-size:16px;fill:#bdd9e8}.t{font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;fill:#f8fcff}.b{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#c8dfe9}.tiny{font-family:Arial,Helvetica,sans-serif;font-size:12px;fill:#9ebccc}.tag{font-family:Arial,Helvetica,sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;fill:#75e8df}.num{font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:700;fill:#071523}</style></defs>
<rect width="1440" height="790" fill="url(#bg)"/><circle cx="1285" cy="90" r="185" fill="#24536d" opacity=".28"/><circle cx="115" cy="760" r="230" fill="#0a6370" opacity=".18"/>
<text x="70" y="76" class="h">Secure Enterprise AI Knowledge Assistant</text><text x="70" y="108" class="s">Private RAG architecture with role-based access, citations, hallucination checks, and query auditability.</text><line x1="70" y1="140" x2="1370" y2="140" stroke="#2e5f78"/>
<g filter="url(#shadow)"><rect x="70" y="190" width="250" height="214" rx="18" fill="#123249" stroke="#38657f"/><rect x="94" y="214" width="42" height="26" rx="13" fill="url(#cyan)"/><text x="109" y="233" class="num">01</text><text x="94" y="274" class="t">Private documents</text><text x="94" y="307" class="b">HR, finance, legal</text><text x="94" y="333" class="b">Engineering and security</text><text x="94" y="359" class="b">Support and incident guides</text><text x="94" y="386" class="tiny">Synthetic by default; real docs stay local</text></g>
<g filter="url(#shadow)"><rect x="390" y="190" width="250" height="214" rx="18" fill="#123249" stroke="#38657f"/><rect x="414" y="214" width="42" height="26" rx="13" fill="url(#cyan)"/><text x="429" y="233" class="num">02</text><text x="414" y="274" class="t">Classification &amp; chunks</text><text x="414" y="307" class="b">Document metadata</text><text x="414" y="333" class="b">Role policy labels</text><text x="414" y="359" class="b">Citation-ready chunks</text><text x="414" y="386" class="tiny">No training on private documents</text></g>
<g filter="url(#shadow)"><rect x="710" y="190" width="250" height="214" rx="18" fill="#123249" stroke="#38657f"/><rect x="734" y="214" width="42" height="26" rx="13" fill="url(#cyan)"/><text x="749" y="233" class="num">03</text><text x="734" y="274" class="t">RBAC retrieval</text><text x="734" y="307" class="b">Filter before ranking</text><text x="734" y="333" class="b">Local TF-IDF vector baseline</text><text x="734" y="359" class="b">Top-k authorized evidence</text><text x="734" y="386" class="tiny">Unauthorized docs never enter candidates</text></g>
<g filter="url(#shadow)"><rect x="1030" y="190" width="340" height="214" rx="18" fill="#123249" stroke="#38657f"/><rect x="1054" y="214" width="42" height="26" rx="13" fill="url(#cyan)"/><text x="1069" y="233" class="num">04</text><text x="1054" y="274" class="t">Grounded assistant</text><text x="1054" y="307" class="b">Extractive answer from context</text><text x="1054" y="333" class="b">Chunk citations required</text><text x="1054" y="359" class="b">Fallback or access-limited refusal</text><text x="1054" y="386" class="tiny">No unsupported synthesis</text></g>
<path d="M320 296 H382" stroke="#a8d0e5" stroke-width="3" marker-end="url(#arr)"/><path d="M640 296 H702" stroke="#a8d0e5" stroke-width="3" marker-end="url(#arr)"/><path d="M960 296 H1022" stroke="#a8d0e5" stroke-width="3" marker-end="url(#arr)"/>
<g filter="url(#shadow)"><rect x="120" y="520" width="350" height="178" rx="18" fill="#123d4a" stroke="#388f99"/><text x="146" y="555" class="tag">HALLUCINATION CONTROL</text><text x="146" y="592" class="t">Citation and claim checks</text><text x="146" y="623" class="b">Citation coverage score</text><text x="146" y="649" class="b">Unsupported claim heuristic</text><text x="146" y="675" class="tiny">Risk flag for human review</text></g>
<g filter="url(#shadow)"><rect x="545" y="520" width="350" height="178" rx="18" fill="#3a3045" stroke="#8d70a5"/><text x="571" y="555" class="tag" fill="#ffdca0">SECURITY GOVERNANCE</text><text x="571" y="592" class="t">Access and redaction</text><text x="571" y="623" class="b">Role-document matrix</text><text x="571" y="649" class="b">Restricted-field redaction demo</text><text x="571" y="675" class="tiny">Policy decision trace</text></g>
<g filter="url(#shadow)"><rect x="970" y="520" width="350" height="178" rx="18" fill="#443824" stroke="#bc9050"/><text x="996" y="555" class="tag" fill="#ffe4a6">AUDITABILITY</text><text x="996" y="592" class="t">Reports and hash chain</text><text x="996" y="623" class="b">Query log and metrics</text><text x="996" y="649" class="b">Synthetic lab briefing</text><text x="996" y="675" class="tiny">Generated locally after execution</text></g>
<path d="M1200 404 C1200 460 1145 470 1145 510" fill="none" stroke="#ffd56d" stroke-width="3" marker-end="url(#arr)"/><path d="M1200 404 C1200 460 720 470 720 510" fill="none" stroke="#ffd56d" stroke-width="3" marker-end="url(#arr)"/><path d="M1200 404 C1200 460 295 470 295 510" fill="none" stroke="#ffd56d" stroke-width="3" marker-end="url(#arr)"/>
<text x="70" y="750" class="tiny">The default corpus is fictional. Real enterprise documents must remain local, authorized, and uncommitted.</text>
</svg>
