<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="460" viewBox="0 0 1400 460" role="img" aria-label="Secure Enterprise AI Knowledge Assistant academic banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#020617"/><stop offset="48%" stop-color="#0f172a"/><stop offset="100%" stop-color="#12355b"/></linearGradient>
    <radialGradient id="glow" cx="22%" cy="16%" r="70%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".25"/><stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000" flood-opacity=".32"/></filter>
    <style>.kicker{font:800 15px Arial,Helvetica,sans-serif;letter-spacing:2px;fill:#67e8f9}.title{font:900 48px Arial,Helvetica,sans-serif;fill:#f8fafc;letter-spacing:-.8px}.accent{font:900 48px Arial,Helvetica,sans-serif;fill:#7dd3fc;letter-spacing:-.8px}.sub{font:600 20px Arial,Helvetica,sans-serif;fill:#cbd5e1}.body{font:500 16px Arial,Helvetica,sans-serif;fill:#94a3b8}.chip{font:800 13px Arial,Helvetica,sans-serif;fill:#ecfeff}.panelTitle{font:800 17px Arial,Helvetica,sans-serif;fill:#e0f2fe}.small{font:600 12px Arial,Helvetica,sans-serif;fill:#94a3b8}</style>
  </defs>
  <rect width="1400" height="460" rx="30" fill="url(#bg)"/><rect width="1400" height="460" rx="30" fill="url(#glow)"/>
  <g opacity=".16" stroke="#7dd3fc" fill="none"><path d="M80 360 C210 300 365 382 520 320 C640 272 742 302 820 354"/><path d="M70 90 H230 M70 130 H176 M70 170 H214"/><circle cx="252" cy="90" r="4" fill="#67e8f9"/><circle cx="192" cy="130" r="4" fill="#34d399"/><circle cx="230" cy="170" r="4" fill="#f59e0b"/></g>
  <g transform="translate(78 78)">
    <text class="kicker" x="0" y="0">PRIVATE ENTERPRISE RAG • RBAC • CITATION GROUNDING</text>
    <text class="title" x="0" y="68">Secure Enterprise AI</text>
    <text class="accent" x="0" y="128">Knowledge Assistant</text>
    <text class="sub" x="0" y="178">Synthetic-first research platform for governed retrieval, grounded answers, refusals, and audit trails.</text>
    <text class="body" x="0" y="216">Designed to study how internal knowledge assistants enforce access controls before retrieval and preserve evidence.</text>
    <g transform="translate(0 258)">
      <rect x="0" y="0" width="150" height="40" rx="14" fill="#0f766e"/><text class="chip" x="75" y="26" text-anchor="middle">RBAC First</text>
      <rect x="168" y="0" width="180" height="40" rx="14" fill="#2563eb"/><text class="chip" x="258" y="26" text-anchor="middle">Citation Grounded</text>
      <rect x="366" y="0" width="164" height="40" rx="14" fill="#7c3aed"/><text class="chip" x="448" y="26" text-anchor="middle">Hash-Chain Audit</text>
      <rect x="548" y="0" width="168" height="40" rx="14" fill="#d97706"/><text class="chip" x="632" y="26" text-anchor="middle">Synthetic Corpus</text>
    </g>
  </g>
  <g transform="translate(895 58)" filter="url(#shadow)">
    <rect x="0" y="0" width="420" height="340" rx="28" fill="#07111f" stroke="#38bdf8" stroke-width="2"/>
    <text class="panelTitle" x="32" y="45">Governed RAG Evidence Console</text>
    <rect x="32" y="74" width="356" height="74" rx="18" fill="#0f172a" stroke="#334155"/>
    <text class="small" x="56" y="102">Query role</text><text x="56" y="130" font-family="Arial" font-size="26" font-weight="900" fill="#f8fafc">security analyst</text>
    <rect x="32" y="168" width="162" height="96" rx="18" fill="#0f172a" stroke="#334155"/>
    <text class="small" x="56" y="198">Policy gate</text><text x="56" y="232" font-family="Arial" font-size="30" font-weight="900" fill="#34d399">PASS</text>
    <rect x="226" y="168" width="162" height="96" rx="18" fill="#0f172a" stroke="#334155"/>
    <text class="small" x="250" y="198">Citation cover</text><text x="250" y="232" font-family="Arial" font-size="30" font-weight="900" fill="#7dd3fc">0.96</text>
    <rect x="32" y="286" width="356" height="30" rx="15" fill="#1e293b"/><rect x="32" y="286" width="286" height="30" rx="15" fill="#2563eb"/>
    <text class="small" x="52" y="307" fill="#e0f2fe">authorized context → answer → audit record</text>
  </g>
</svg>