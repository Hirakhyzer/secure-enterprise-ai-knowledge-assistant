<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="690" viewBox="0 0 1440 690" role="img" aria-labelledby="title desc">
<title id="title">Enterprise RAG access-control flow</title><desc id="desc">Conceptual flow showing query role, policy filtering before retrieval, citation-grounded answer, hallucination check, and audit log.</desc>
<defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fffaf2"/><stop offset="1" stop-color="#f1f8ff"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#31516a" flood-opacity=".16"/></filter><marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L12 6 L0 12z" fill="#59768e"/></marker><style>.h{font-family:Arial,Helvetica,sans-serif;font-size:31px;font-weight:700;fill:#19344d}.s{font-family:Arial,Helvetica,sans-serif;font-size:16px;fill:#5c768b}.tag{font-family:Arial,Helvetica,sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;fill:#277c94}.t{font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;fill:#19344d}.b{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#49657a}.small{font-family:Arial,Helvetica,sans-serif;font-size:12px;fill:#71899b}.white{font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:700;fill:#fff}</style></defs>
<rect width="1440" height="690" fill="url(#bg)"/><text x="70" y="70" class="h">Role-based access and grounding flow</text><text x="70" y="102" class="s">The critical design choice is filtering unauthorized documents before vector ranking and generation.</text><line x1="70" y1="132" x2="1370" y2="132" stroke="#d9e6ee"/>
<g filter="url(#shadow)"><rect x="80" y="205" width="230" height="285" rx="20" fill="#fff" stroke="#c7dae5"/><text x="108" y="244" class="tag">USER QUERY</text><text x="108" y="286" class="t">Role context</text><text x="108" y="322" class="b">employee</text><text x="108" y="348" class="b">engineer</text><text x="108" y="374" class="b">finance</text><text x="108" y="400" class="b">legal</text><text x="108" y="426" class="b">security analyst</text></g>
<g filter="url(#shadow)"><rect x="420" y="205" width="260" height="285" rx="20" fill="#173b52"/><text x="450" y="244" style="font-family:Arial,Helvetica,sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;fill:#74e3dc">POLICY GATE</text><text x="450" y="286" class="white" style="font-size:18px">Filter candidates</text><text x="450" y="322" style="font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#c9dde8">Document roles checked</text><text x="450" y="348" style="font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#c9dde8">Unauthorized chunks excluded</text><text x="450" y="374" style="font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#c9dde8">Decision trace logged</text><rect x="450" y="414" width="200" height="44" rx="12" fill="#244f68"/><text x="472" y="442" style="font-family:Arial,Helvetica,sans-serif;font-size:12px;fill:#d7eef5">before retrieval</text></g>
<g filter="url(#shadow)"><rect x="790" y="205" width="260" height="285" rx="20" fill="#fff" stroke="#c7dae5"/><text x="818" y="244" class="tag">AUTHORIZED RAG</text><text x="818" y="286" class="t">Rank and answer</text><text x="818" y="322" class="b">TF-IDF baseline</text><text x="818" y="348" class="b">Top-k chunks</text><text x="818" y="374" class="b">Citation markers</text><text x="818" y="400" class="b">Fallback if no evidence</text></g>
<g filter="url(#shadow)"><rect x="1160" y="205" width="205" height="285" rx="20" fill="#453823"/><text x="1185" y="244" style="font-family:Arial,Helvetica,sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;fill:#ffe4a6">POST-CHECKS</text><text x="1185" y="286" class="white" style="font-size:18px">Verify</text><text x="1185" y="322" style="font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#f2dfc6">Citation coverage</text><text x="1185" y="348" style="font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#f2dfc6">Unsupported claims</text><text x="1185" y="374" style="font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#f2dfc6">Redaction</text><text x="1185" y="400" style="font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#f2dfc6">Audit hash chain</text></g>
<path d="M310 348 H408" stroke="#59768e" stroke-width="3" marker-end="url(#arr)"/><path d="M680 348 H778" stroke="#59768e" stroke-width="3" marker-end="url(#arr)"/><path d="M1050 348 H1148" stroke="#59768e" stroke-width="3" marker-end="url(#arr)"/>
<g filter="url(#shadow)"><rect x="250" y="580" width="940" height="54" rx="17" fill="#fef3dc" stroke="#e5bb79"/><text x="285" y="614" style="font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:700;fill:#21384f">Security invariant:</text><text x="425" y="614" style="font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#49657a">unauthorized documents never enter retrieval candidates, generation context, citations, or answer text.</text></g>
</svg>
